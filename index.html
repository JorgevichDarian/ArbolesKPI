<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árboles de KPIs DPO 2.0 · Logística Total</title>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#1f2328; --mute:#667085; --line:#e3e6eb;
  --navy:#2b2f36; --navy2:#3a3f48; --acc:#f07f1d; --grey:#8c8f94;
  --s-rojo:#d64545; --s-naranja:#ef8a17; --s-amarillo:#e9c21b; --s-verde:#1e9e5a; --s-gris:#c3c9d3;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.brand{background:linear-gradient(90deg,#0d0f12 0%,#1a1d22 100%);display:flex;align-items:center;gap:16px;padding:12px 22px;flex-wrap:wrap}
.brand img{height:46px;filter:drop-shadow(0 0 1px rgba(255,255,255,.25))}
.brand .ttl{display:flex;flex-direction:column;line-height:1.15}
.brand .ttl b{color:#fff;font-size:20px;letter-spacing:2px;font-weight:800}
.brand .ttl span{color:var(--acc);font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;margin-top:3px}
.brand .hright{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12px;flex-wrap:wrap}
.chip{background:#2a2e35;color:#d5d8de;padding:5px 10px;border-radius:20px;white-space:nowrap;border:1px solid #363b44}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
nav{background:#1a1d22;display:flex;gap:6px;padding:6px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20;align-items:center;border-top:1px solid #2c3037;border-bottom:3px solid var(--acc)}
nav button{background:transparent;color:#d5d8de;border:0;padding:7px 13px;border-radius:6px;font-weight:600;cursor:pointer;font-size:13px}
nav button:hover{background:var(--navy2)}
nav button.on{background:var(--navy2);color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}
nav .grp{display:flex;align-items:center;gap:2px;border:1px solid #4a505a;border-radius:8px;padding:2px 4px 2px 10px}
nav .grp>span{color:var(--acc);font-weight:800;font-size:12px;margin-right:4px;letter-spacing:.5px}
main{padding:18px 20px;max-width:1750px;margin:0 auto}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:14px 0 6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}
.muted{color:var(--mute)}
.btn{background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:13px;display:inline-block}
.btn.sec{background:#e8ebf0;color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;font-size:13px;border:1px solid #cfd4dc;border-radius:6px;padding:6px 8px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters select,.filters input[type=search]{min-width:140px;max-width:240px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:140px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.3px}
.kpi .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.tblwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 290px)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#eef0f3;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:#3d4450;position:sticky;top:0;z-index:2;white-space:nowrap}
.sem{width:6px;padding:0!important}
.sem-rojo{background:var(--s-rojo)}.sem-naranja{background:var(--s-naranja)}.sem-amarillo{background:var(--s-amarillo)}.sem-verde{background:var(--s-verde)}.sem-gris{background:var(--s-gris)}.sem-vacio{background:#f1f2f4}
.tree td{font-size:12.5px}
.tree tr:hover td{background:#f7f9fc}
.tree tr.d0 td{background:#fff7ef;font-weight:700;font-size:13.5px}
.tree tr.d1 td.nm{font-weight:600}
td.nm{min-width:320px}
.nmw{display:flex;align-items:flex-start;gap:4px}
.car{width:18px;flex:0 0 18px;border:0;background:none;cursor:pointer;color:#6b7380;font-size:11px;padding:2px 0;line-height:1.3}
.car.leaf{cursor:default;color:#c9ced6}
.lv{display:inline-block;font-size:10px;font-weight:800;border-radius:4px;padding:1px 6px;letter-spacing:.4px;color:#fff}
.lv-SKPI{background:var(--navy)}.lv-KPI{background:var(--acc)}.lv-PI{background:#9aa3b2}
.unit{color:var(--mute);font-size:11.5px;white-space:nowrap}
input.val{width:92px;text-align:right;font-size:12.5px;padding:4px 6px}
input.val.has{border-color:#9fc5ad;background:#f4fbf6}
td.prev{color:#a0a7b4;text-align:right;white-space:nowrap}
td.obj{text-align:right;white-space:nowrap}
td.def{max-width:300px;font-size:12px;line-height:1.35}
.pend{display:inline-block;background:#fbe1e1;color:#9b1c1c;font-weight:700;border-radius:5px;padding:1px 7px;font-size:11px}
.sug{color:#7a5a00;font-style:italic}
.sug b{font-style:normal;background:#fff3d0;border-radius:4px;padding:0 5px;font-size:10px;margin-right:4px}
.edit{white-space:nowrap;border:1px solid #cfd4dc;background:#fff;border-radius:6px;cursor:pointer;padding:3px 8px;font-size:12px}
.edit:hover{border-color:var(--acc)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}
.legend span{display:flex;align-items:center;gap:6px}
.sq{width:14px;height:14px;border-radius:3px;display:inline-block}
.sect{font-size:12px;font-weight:800;color:var(--acc);letter-spacing:.6px;margin:4px 0 10px;text-transform:uppercase}
.info p,.info li{line-height:1.55}
.formula{background:#f6f7f9;border-left:4px solid var(--acc);padding:10px 14px;border-radius:6px;font-weight:600}
.warn{background:#fff6e0;border:1px solid #f3d98b;border-radius:8px;padding:10px 12px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(30,33,38,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 10px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;width:min(640px,96vw)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.modal .full{grid-column:1/-1}
.modal textarea{min-height:64px;width:100%}
.modal input,.modal select{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1}
.savebar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#1a1d22;color:#fff;border-radius:30px;padding:8px 10px 8px 18px;gap:12px;align-items:center;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.savebar.on{display:flex}
.trnote{font-size:12.5px;color:var(--mute);margin:-4px 0 12px}
.path{font-size:11.5px;color:var(--mute)}
@media (max-width:700px){main{padding:12px}.grid2{grid-template-columns:1fr}.brand .ttl b{font-size:16px}.modal .grid{grid-template-columns:1fr}}
</style>
</head>

const SIF_CATS = ['Falls','Vehicle Incident','Forklift Incident','Pedestrians Hit by Vehicle','Musculoskeletal Disorders','Contact with Objects','Cut by Sharps, Glass or Other Sharp Object','Violence (Robbery-Assault)','Exposure to Hazardous Substances','Exposure to Heat and Cold','Exposure to Electricity','Fire','Explosion/Implosion','Exposure to Dust – Non Hazardous','Exposure to Noise','Confined Space Incidents','Animals','Walkie Incident','Machine Incident','Power Tool Incident','Lifting Equipment Incident'];
function sifBlock(t){
  let s = `    SIF ${t} (#)\n`;
  for(const c of SIF_CATS){
    s += `      SIF Actual ${t} - ${c}\n        SIF Potential - ${c}\n          SIF Precursor - ${c}\n`;
    const rx = `Risk Exposure - ${c==='Falls'?'Fall':c} (Process Issue) (#)`;
    if(c==='Vehicle Incident') s += `            Globally Defined SIF Precursors\n              Speeding\n              12 Hour Violation\n            Locally Defined Risk Exposure\n              ${rx}\n`;
    else s += `            ${rx}\n`;
  }
  return s;
}

const OUT_TQI = `Total Quality Index (%)`;

function expand(txt, map){
  const out=[];
  for(const line of txt.split('\n')){
    const ind = line.match(/^ */)[0];
    const t = line.trim();
    const m = t.match(/^@(\w+)(?::(.*))?$/);
    if(!m){ out.push(line); continue; }
    if(m[1]==='DAMAGED'){ out.push(ind+m[2]); map.DAMAGED.split('\n').forEach(l=>out.push(ind+'  '+l)); }
    else if(m[1]==='DRIVER'){ const p=m[2]; out.push(`${ind}${p} - "driver-related issue" (#)`,`${ind}  ${p} - "driver-related issue" due to employee behavior (#)`,`${ind}  ${p} - "driver-related issue" due to process knowledge (#)`); }
    else map[m[1]].split('\n').forEach(l=>out.push(ind+l));
  }
  return out.join('\n');
}

/* ================= MODELO ================= */
const NODES = {}; // id -> node
function parseUnit(t){ const m=t.match(/^(.*?)\s*\(([^()]*)\)\s*$/); if(!m) return {name:t,unit:''}; return {name:m[1],unit:m[2]}; }
for(const tr of TREES){
  const lines = tr.out.split('\n').filter(l=>l.trim());
  const stack=[]; tr.roots=[]; tr.all=[];
  lines.forEach((l,i)=>{
    const d=(l.match(/^ */)[0].length)/2, text=l.trim();
    while(stack.length>d) stack.pop();
    const parent=stack[stack.length-1]||null;
    const pu=parseUnit(text);
    const n={id:tr.id+'-'+i, tree:tr, text, name:pu.name, unit:pu.unit, depth:d, parent, kids:[]};
    n.chain = (parent?parent.chain+' › ':'')+text;
    n.key = tr.pathKeys ? tr.id+'|'+n.chain : text;
    if(parent) parent.kids.push(n); else tr.roots.push(n);
    stack.push(n); tr.all.push(n); NODES[n.id]=n;
  });
}
const LVL = d => d===0?'SKPI':d===1?'KPI':'PI';
const LOWER_RX = /cost|damage|delay|absent|refus|deviation|dispersion|turnover|\bTO\b|mixed|idle|overtime|postponed|stock out|out of|breakdown|issue|reattempt|unexpected|low rate|no rating|detractor|lost|injur|SIF|LTI|MDI|MTI|FAI|near miss|risk|withdraw|error|without|waiting|time|missed|accident|underperform|complaint|oos|not |oversold|holiday|vacation|unpaid|absence|hours|spare parts below|complexity|differences|out of compliance|missing|not meeting/i;
function meta(n){ return ST.meta[n.key] || {}; }
function dirOf(n){ const m=meta(n); if(m.dir) return m.dir; if(/Productivity|Accuracy|Adherence|Availability|Efficiency|Compliance|Score|Fulfillment|Utilization|Occupation|On Time \(|In Full|OTIF|Rate My Delivery|Rating Given|High Rate|Promoters|Reversed|Feedback|Achievement|In Service|Volume Delivered|Cases per|Drop Size|Stops per|Routed|completion|SLA/i.test(n.text) && !/Dispersion|Deviation/.test(n.text)) return 'up'; return LOWER_RX.test(n.text)?'down':'up'; }
function calcOf(n){ return meta(n).calc || ''; }
function fuenteOf(n){ return meta(n).fuente || ''; }

/* ================= PERÍODOS ================= */
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const now=new Date(); const curYM = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
function ymAdd(ym,k){ let [y,m]=ym.split('-').map(Number); m+=k; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+'-'+String(m).padStart(2,'0'); }
function ymLbl(ym){ const [y,m]=ym.split('-').map(Number); return MES[m-1]+' '+y; }
let PER = curYM;
(function(){ const s=document.getElementById('fMes'); let ym=ymAdd(curYM,6); const start='2024-01'; while(ym>=start){ const o=document.createElement('option'); o.value=ym; o.textContent=ymLbl(ym)+(ST.vals[ym]&&Object.keys(ST.vals[ym]).length?' ●':''); s.appendChild(o); ym=ymAdd(ym,-1);} s.value=PER; })();

function val(n,ym){ const v=(ST.vals[ym]||{})[n.key]; return (v===undefined||v===null||v==='')?null:v; }
function fmt(v){ if(v===null||v===undefined||v==='') return ''; const x=Number(v); if(isNaN(x)) return String(v); return x.toLocaleString('es-AR',{maximumFractionDigits:2}); }
function num(s){ if(s===null||s===undefined) return null; s=String(s).trim().replace(/\s/g,''); if(!s) return null; if(/,/.test(s)) s=s.replace(/\./g,'').replace(',','.'); const x=Number(s); return isNaN(x)?null:x; }
function status(n,ym){ const v=val(n,ym); if(v===null) return 'vacio'; const o=num(meta(n).obj); if(o===null) return 'gris'; const up=dirOf(n)==='up'; const ok= up? v>=o : v<=o; if(ok) return 'verde'; const gap = up ? (o-v)/Math.abs(o||1) : (v-o)/Math.abs(o||1); return gap<=0.05?'amarillo':(gap<=0.15?'naranja':'rojo'); }

/* ================= UI ================= */
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TAB='info'; const OPEN={}; // nodeId -> bool
TREES.forEach(t=>t.all.forEach(n=>OPEN[n.id]=n.depth<2));

function buildNav(){

  for(const t of TREES){ if(t.grp!==g){ if(g) h+='</div>'; h+=`<div class="grp"><span>${t.grp}</span>`; g=t.grp; } h+=`<button data-t="${t.id}">${t.tab}</button>`; }
  h+='</div><button data-t="defs">DEFINICIONES</button>';
  nav.innerHTML=h;
  nav.onclick=e=>{ const b=e.target.closest('button[data-t]'); if(b){ location.hash=b.dataset.t; } };
  const tabs=document.getElementById('tabs');

}
function go(){ const h=location.hash.slice(1); TAB = (h==='info'||h==='defs'||TREES.some(t=>t.id===h))?h:'info';
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+TAB));
  document.getElementById('fbar').style.display = TAB==='info'?'none':'';
  render(); }

function filt(){ return {show:document.getElementById('fShow').value, lvl:+document.getElementById('fLvl').value, q:document.getElementById('fQ').value.trim().toLowerCase()}; }
function match(n,f){
  if(n.depth>f.lvl) return false;
  if(f.q){ const hay=(n.text+' '+fuenteOf(n)+' '+calcOf(n)+' '+(SUG[n.text]||'')).toLowerCase(); if(!hay.includes(f.q)) return false; }
  const v=val(n,PER);
  if(f.show==='nodata' && v!==null) return false;
  if(f.show==='con' && v===null) return false;
  if(f.show==='nofuente' && fuenteOf(n)) return false;
  if(f.show==='nocalc' && calcOf(n)) return false;
  if(f.show==='rojo' && !['rojo','naranja'].includes(status(n,PER))) return false;
  return true;
}
function render(){
  document.getElementById('perChip').textContent='📅 '+ymLbl(PER);
  if(TAB==='info') return renderInfo();
  if(TAB==='defs') return renderDefs();
  renderTree(TREES.find(t=>t.id===TAB));
}

function tiles(t){
  const r=t.roots[0], prev=ymAdd(PER,-1);
  const v=val(r,PER), pv=val(r,prev), o=num(meta(r).obj);
  const uniq=[...new Map(t.all.map(n=>[n.key,n])).values()];
  const conDato=uniq.filter(n=>val(n,PER)!==null).length, conF=uniq.filter(n=>fuenteOf(n)).length, conC=uniq.filter(n=>calcOf(n)).length;
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  let d=''; if(v!==null&&pv!==null){ const dd=v-pv; d=(dd>=0?'▲ ':'▼ ')+fmt(Math.abs(dd))+' vs mes ant.'; }
  return `<div class="kpis">
    <div class="kpi"><div class="l">${esc(r.name)} · ${ymLbl(PER)}</div><div class="v">${v===null?'—':fmt(v)} <span class="unit">${esc(r.unit)}</span></div><div class="s">${d||(v===null?'Sin dato cargado':'Sin mes anterior para comparar')}</div></div>
    <div class="kpi"><div class="l">Objetivo</div><div class="v">${o===null?'—':fmt(o)}</div><div class="s">${dirOf(r)==='up'?'↑ mayor es mejor':'↓ menor es mejor'}</div></div>
    <div class="kpi"><div class="l">Mes anterior</div><div class="v">${pv===null?'—':fmt(pv)}</div><div class="s">${ymLbl(prev)}</div></div>
    <div class="kpi"><div class="l">Indicadores con dato</div><div class="v">${pct(conDato,uniq.length)}</div><div class="s">${conDato} de ${uniq.length}</div></div>
    <div class="kpi"><div class="l">Con fuente definida</div><div class="v">${pct(conF,uniq.length)}</div><div class="s">${conF} de ${uniq.length}</div></div>
    <div class="kpi"><div class="l">Con cálculo definido</div><div class="v">${pct(conC,uniq.length)}</div><div class="s">${conC} de ${uniq.length}</div></div>
  </div>`;
}
function visibleRows(t){
  const f=filt(); const active = f.q || f.show!=='all';
  const out=[];
  if(active){
    const keep=new Set();
    t.all.forEach(n=>{ if(match(n,f)){ let p=n; while(p){ keep.add(p.id); p=p.parent; } } });
    t.all.forEach(n=>{ if(keep.has(n.id) && n.depth<=f.lvl) out.push(n); });
  } else {
    const walk=n=>{ if(n.depth>f.lvl) return; out.push(n); if(OPEN[n.id]) n.kids.forEach(walk); };
    t.roots.forEach(walk);
  }
  return {rows:out, active};
}
function defCell(txt, sug){
  if(txt) return esc(txt);
  if(sug) return `<span class="sug"><b>SUGERIDO</b>${esc(sug)}</span>`;
  return '<span class="pend">Por definir</span>';
}
function renderTree(t){
  const sec=document.getElementById('t-'+t.id);
  const {rows,active}=visibleRows(t); const prev=ymAdd(PER,-1); const f=filt();
  let h = tiles(t) + `<div class="trnote"><b>${esc(t.title)}.</b> ${esc(t.note)}</div>`;
  h += `<div class="tblwrap"><table class="tree"><thead><tr><th class="sem"></th><th>Indicador</th><th>Nivel</th><th>Unidad</th><th style="text-align:right">${esc(ymLbl(PER))}</th><th style="text-align:right">Mes ant.</th><th style="text-align:right">Objetivo</th><th>Fuente de datos</th><th>Cálculo</th><th></th></tr></thead><tbody>`;
  for(const n of rows){
    const hasK = n.kids.length && n.depth<f.lvl;
    const car = hasK ? `<button class="car" data-tog="${n.id}">${(OPEN[n.id]||active)?'▼':'▶'}</button>` : `<span class="car leaf">•</span>`;
    const v=val(n,PER), pv=val(n,prev), m=meta(n);
    h+=`<tr class="d${Math.min(n.depth,2)}" data-id="${n.id}"><td class="sem sem-${status(n,PER)}" data-sk="${esc(n.key)}"></td>
      <td class="nm"><div class="nmw" style="padding-left:${n.depth*18}px">${car}<span>${esc(n.name)}</span></div></td>
      <td><span class="lv lv-${LVL(n.depth)}">${LVL(n.depth)}</span></td>
      <td class="unit">${esc(n.unit)}</td>
      <td style="text-align:right"><input class="val${v!==null?' has':''}" data-k="${esc(n.key)}" value="${v===null?'':esc(fmt(v))}" inputmode="decimal" placeholder="—"></td>
      <td class="prev">${pv===null?'—':fmt(pv)}</td>
      <td class="obj">${m.obj?esc(m.obj)+' '+(dirOf(n)==='up'?'↑':'↓'):'<span class="muted">—</span>'}</td>
      <td class="def">${defCell(fuenteOf(n), FUE[n.text])}</td>
      <td class="def">${defCell(calcOf(n), SUG[n.text])}</td>
      <td><button class="edit" data-ed="${n.id}">✎ Definir</button></td></tr>`;
  }
  if(!rows.length) h+=`<tr><td></td><td colspan="9" class="muted" style="padding:18px">No hay indicadores que cumplan el filtro.</td></tr>`;
  h+='</tbody></table></div>';
  sec.innerHTML=h;
}

function renderDefs(){
  const sec=document.getElementById('t-defs'); const f=filt();
  const seen=new Map();
  for(const t of TREES) for(const n of t.all){ if(!seen.has(n.key)) seen.set(n.key,{n,trees:new Set(),lvl:n.depth}); const e=seen.get(n.key); e.trees.add(t.tab); e.lvl=Math.min(e.lvl,n.depth); }
  let list=[...seen.values()].filter(e=>match(Object.assign(Object.create(e.n),{depth:e.lvl}),f));

  let h=`<div class="kpis"><div class="kpi"><div class="l">Indicadores únicos</div><div class="v">${tot}</div></div>

  if(!list.length) h+='<tr><td colspan="8" class="muted" style="padding:18px">No hay indicadores que cumplan el filtro.</td></tr>';

}

let DIRTY=false, saveTimer=null, READONLY=false;
function markDirty(){ DIRTY=true; const sb=document.getElementById('savebar'); sb.classList.add('on'); document.getElementById('sbTxt').textContent = MODE==='shared'?'Cambios sin guardar':'Cambios sin guardar (este navegador)'; clearTimeout(saveTimer); saveTimer=setTimeout(save,8000); }
document.addEventListener('change',e=>{
  const i=e.target.closest('input.val'); if(!i) return;
  if(READONLY){ toast('Solo lectura: no tenés permiso para editar'); return; }
  const k=i.dataset.k, x=num(i.value);
  ST.vals[PER]=ST.vals[PER]||{};
  if(x===null){ delete ST.vals[PER][k]; } else ST.vals[PER][k]=x;
  document.querySelectorAll('input.val').forEach(o=>{ if(o.dataset.k===k){ o.value=x===null?'':fmt(x); o.classList.toggle('has',x!==null);} });
  const any=Object.values(NODES).find(n=>n.key===k);
  document.querySelectorAll('td.sem').forEach(td=>{ if(td.dataset.sk===k){ td.className='sem sem-'+status(any,PER);} });
  const t=TREES.find(t=>t.id===TAB); if(t){ const sec=document.getElementById('t-'+t.id); const old=sec.querySelector('.kpis'); if(old) old.outerHTML=tiles(t); }
  markDirty();
});
document.addEventListener('keydown',e=>{ const i=e.target.closest&&e.target.closest('input.val'); if(i&&e.key==='Enter'){ const all=[...document.querySelectorAll('input.val')]; const nx=all[all.indexOf(i)+1]; i.blur(); if(nx) nx.focus(); } });
document.addEventListener('click',e=>{
  const tg=e.target.closest('[data-tog]'); if(tg){ const id=tg.dataset.tog; OPEN[id]=!OPEN[id]; render(); return; }
  const ed=e.target.closest('[data-ed]'); if(ed){ openEd(NODES[ed.dataset.ed]); return; }
});
function openEd(n){
  const m=meta(n), sug=SUG[n.text]||'', fs=FUE[n.text]||'';
  const md=document.getElementById('md');
  md.innerHTML=`<div class="sect">${esc(n.tree.title)} · <span class="lv lv-${LVL(n.depth)}">${LVL(n.depth)}</span></div>
   <h2>${esc(n.name)}</h2><div class="path">${esc(n.chain)}</div>
   <div class="grid">
    <label class="f full">Fuente de datos (sistema / reporte / planilla / área)<textarea id="eF" placeholder="Ej: SAP – reporte de rechazos por motivo; BEES; Roadnet; planilla de RRHH…">${esc(m.fuente||'')}</textarea>${fs&&!m.fuente?`<button class="lnk" data-use="eF" data-txt="${esc(fs)}">Usar sugerencia: ${esc(fs)}</button>`:''}</label>
    <label class="f full">Cálculo / fórmula<textarea id="eC" placeholder="Ej: Volumen rechazado / Volumen cargado × 100">${esc(m.calc||'')}</textarea>${sug&&!m.calc?`<button class="lnk" data-use="eC" data-txt="${esc(sug)}">Usar sugerencia: ${esc(sug)}</button>`:''}</label>
    <label class="f">Objetivo<input id="eO" value="${esc(m.obj||'')}" placeholder="Ej: 95"></label>
    <label class="f">Sentido<select id="eD"><option value="up">↑ Mayor es mejor</option><option value="down">↓ Menor es mejor</option></select></label>
    <label class="f">Responsable<input id="eR" value="${esc(m.resp||'')}" placeholder="Área o persona"></label>
    <label class="f">Frecuencia de actualización<input id="eQ" value="${esc(m.freq||'Mensual')}"></label>
    <label class="f full">Notas / criterios<textarea id="eN" placeholder="Exclusiones, cortes de fecha, aperturas…">${esc(m.notas||'')}</textarea></label>
   </div>
   <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn sec" id="eX">Cancelar</button><button class="btn acc" id="eS">Aplicar</button></div>`;
  md.querySelector('#eD').value=dirOf(n);
  md.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{ md.querySelector('#'+b.dataset.use).value=b.dataset.txt; b.remove(); });
  md.querySelector('#eX').onclick=closeEd;
  md.querySelector('#eS').onclick=()=>{
    if(READONLY){ toast('Solo lectura: no tenés permiso para editar'); return; }
    const g=id=>md.querySelector(id).value.trim();
    ST.meta[n.key]={fuente:g('#eF'),calc:g('#eC'),obj:g('#eO'),dir:g('#eD'),resp:g('#eR'),freq:g('#eQ'),notas:g('#eN')};
    closeEd(); render(); markDirty();
  };
  document.getElementById('ov').classList.add('on');
}
function closeEd(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeEd(); });

/* ================= FILTROS / ACCIONES ================= */
document.getElementById('fMes').onchange=e=>{ PER=e.target.value; render(); };
['fShow','fLvl'].forEach(id=>document.getElementById(id).onchange=render);
let qT; document.getElementById('fQ').oninput=()=>{ clearTimeout(qT); qT=setTimeout(render,200); };
document.getElementById('bExp').onclick=()=>{ const t=TREES.find(t=>t.id===TAB); (t?t.all:Object.values(NODES)).forEach(n=>OPEN[n.id]=true); render(); };
document.getElementById('bCol').onclick=()=>{ const t=TREES.find(t=>t.id===TAB); (t?t.all:Object.values(NODES)).forEach(n=>OPEN[n.id]=n.depth<1); render(); };
document.getElementById('bCopy').onclick=async()=>{
  const t=TREES.find(t=>t.id===TAB); const ts=t?[t]:TREES; const prev=ymAdd(PER,-1);
  const rows=[['Árbol','Nivel','Indicador','Ruta','Unidad',ymLbl(PER),ymLbl(prev),'Objetivo','Sentido','Fuente de datos','Cálculo','Responsable']];
  const clean=s=>String(s??'').replace(/[\t\n\r]+/g,' ');
  ts.forEach(tr=>tr.all.forEach(n=>{ const m=meta(n); rows.push([tr.title,LVL(n.depth),'  '.repeat(n.depth)+n.name,n.chain,n.unit,fmt(val(n,PER)),fmt(val(n,prev)),m.obj||'',dirOf(n)==='up'?'↑':'↓',fuenteOf(n),calcOf(n)||(SUG[n.text]?'[sugerido] '+SUG[n.text]:''),m.resp||''].map(clean)); }));
  try{ await navigator.clipboard.writeText(rows.map(r=>r.join('\t')).join('\n')); toast('Tabla copiada: pegala en Excel'); }catch(e){ toast('No se pudo copiar al portapapeles'); }
};
document.getElementById('bJson').onclick=()=>{
  const md=document.getElementById('md');
  md.innerHTML=`<h2>Exportar / importar datos</h2><p class="muted" style="margin:6px 0 10px">Copia de seguridad de valores mensuales y definiciones. Sirve también para pasar los datos a otra versión de la página (por ejemplo, una publicada en GitHub Pages).</p>
   <textarea id="jx" style="width:100%;min-height:220px;font-family:monospace;font-size:11.5px">${esc(JSON.stringify({meta:ST.meta,vals:ST.vals},null,1))}</textarea>
   <div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn sec" id="jc">⧉ Copiar</button><button class="btn sec" id="jx0">Cerrar</button><button class="btn acc" id="ji">Importar lo pegado</button></div>`;
  md.querySelector('#jx0').onclick=closeEd;
  md.querySelector('#jc').onclick=async()=>{ try{ await navigator.clipboard.writeText(md.querySelector('#jx').value); toast('Copiado'); }catch(e){ toast('No se pudo copiar'); } };
  md.querySelector('#ji').onclick=()=>{ try{ const o=JSON.parse(md.querySelector('#jx').value); if(!o.meta||!o.vals) throw 0; if(READONLY) return toast('Solo lectura'); ST.meta=o.meta; ST.vals=o.vals; closeEd(); render(); markDirty(); toast('Datos importados'); }catch(e){ toast('El texto no es un JSON válido de este reporte'); } };
  document.getElementById('ov').classList.add('on');
};

/* ================= PERSISTENCIA ================= */
let ART=null, MODE='init';
function setConn(){ const c=document.getElementById('conn');
  const map={init:['#999','conectando…'],shared:['#1e9e5a','datos compartidos'],local:['#e9c21b','modo local (este navegador)'],ro:['#9aa3b2','solo lectura']};
  const [col,txt]=map[READONLY?'ro':MODE]; c.innerHTML=`<span class="dot" style="background:${col}"></span>${txt}${ST.upd?` · act. ${new Date(ST.upd).toLocaleDateString('es-AR')}`:''}`; }
function buildDoc(){
  ST.upd=new Date().toISOString();
  const json=JSON.stringify(ST).replace(/</g,'\\u003c');
  const open='<script type="application/json" id="st">';
  const a=TPL.indexOf(open), b=TPL.indexOf(SCRIPT_END,a);
  return TPL.slice(0,a+open.length)+json+TPL.slice(b);
}
async function save(){
  clearTimeout(saveTimer); if(!DIRTY) return;
  const btn=document.getElementById('bSave'); btn.disabled=true;
  if(MODE==='shared'&&ART){
    try{ await ART.publish(buildDoc()); DIRTY=false; document.getElementById('savebar').classList.remove('on'); toast('Guardado'); }
    catch(e){ const code=(e&&(e.code||e.message))||''; if(/not_granted|not_writer/.test(code)){ READONLY=true; setConn(); toast('No tenés permiso para guardar cambios'); } else if(/conflict/.test(code)){ toast('Otra persona guardó al mismo tiempo; se recarga la última versión'); } else { toast('No se pudo guardar. Probá de nuevo.'); } }
  } else {
    try{ ST.upd=new Date().toISOString(); localStorage.setItem('ltsrl-dpo-kpis',JSON.stringify(ST)); DIRTY=false; document.getElementById('savebar').classList.remove('on'); toast('Guardado en este navegador'); }
    catch(e){ toast('Este navegador no permite guardar; usá Exportar'); }
  }
  btn.disabled=false; setConn();
}
document.getElementById('bSave').onclick=save;
window.addEventListener('beforeunload',e=>{ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2600); }

buildNav();
window.addEventListener('hashchange',go);
go(); setConn();
(async()=>{
  try{ if(window.claude && typeof window.claude.use==='function') ART = await window.claude.use('artifact'); }catch(e){ ART=null; }
  if(ART){ MODE='shared'; }
  else { MODE='local'; try{ const s=localStorage.getItem('ltsrl-dpo-kpis'); if(s){ const o=JSON.parse(s); if(o&&o.meta&&o.vals){ ST=o; } } }catch(e){} render(); }
  setConn();
})();
</script>
</body>
</html>
